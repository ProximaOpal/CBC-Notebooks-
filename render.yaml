# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: cbc-notebooks
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node scripts/serve.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://cbc-notebooks-v7aa.onrender.com
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_BASE_URL
        value: https://sandbox.safaricom.co.ke
      - key: MPESA_CALLBACK_URL
        value: https://cbc-notebooks-v7aa.onrender.com/api/payments/mpesa/callback
      - key: MPESA_C2B_VALIDATION_URL
        value: https://cbc-notebooks-v7aa.onrender.com/api/payments/mpesa/c2b-validation
      - key: MPESA_C2B_CONFIRMATION_URL
        value: https://cbc-notebooks-v7aa.onrender.com/api/payments/mpesa/c2b-confirmation
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: SESSION_SECRET
        sync: false
